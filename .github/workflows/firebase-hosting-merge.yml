name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Pin exact patch: Node 24.17.x has an http.Agent keep-alive bug that
          # causes "Premature close" on Firebase API calls and can fail deploys
          # with "supplied version is the current active version". See nodejs/node#63989.
          node-version: '22.23.1'
          cache: 'npm'
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRINCEMAKAVANA6102 }}'
          channelId: live
          projectId: princemakavana6102
          firebaseToolsVersion: '15.22.3'
